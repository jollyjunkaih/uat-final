features:
  - name: Asset Registration & Onboarding
    description: Two-phase asset registration lifecycle covering physical registration and financial registration. Physical registration captures asset class, category, location, supplier details, invoice, serial number, warranty provider, and lifecycle stage. Financial registration records purchase cost, GL account code assignment, depreciation configuration, and ownership type. Generates unique reference numbers (K1-ASSET-{CLASS}-{ID}) and supports QR code label generation and printing.
    module: Asset Management
    priority: high
    status: draft
    ecosystem: Admin Desktop App + Backend + Mobile App
    inScope: Manual asset registration (two-phase — physical details and financial registration), bulk CSV/Excel import with field mapping wizard, auto-registration from completed purchase orders, asset class classification (Property, Buildings, Vehicles, Machinery, Corporate, Others), asset lifecycle stage tracking (Procurement, Deployment, In-Service, End-of-Life), asset ownership type (Owned, Leased, Rented), QR code generation and label printing, asset photo upload and document attachment (service contracts, insurance certificates, invoices, manuals), unique reference number generation (K1-ASSET-{CLASS}-{ID}), asset status management (Active, In Repair, Pending Disposal, Missing, Disposed), custodian and department assignment, warranty provider (vendor) tracking with expiry alerts, service schedule configuration (by month or mileage intervals), GL account code assignment for financial classification.
    outOfScope: RFID tag programming, GPS real-time tracking hardware integration, standalone insurance policy management module.
    sequence: 0
    mockScreens:
      - fileName: asset_registration_onboarding
        sequence: 1
      - fileName: asset_registry_dashboard
        sequence: 2
      - fileName: asset_details_view
        sequence: 3
      - fileName: bulk_upload_mapping_wizard
        sequence: 4
    processFlows: []
    uatFlows:
      - name: Register New Asset — Physical Information
        description: User fills in the physical asset registration form with asset class, category, serial number, location, custodian, warranty provider, lifecycle stage, and supporting documents.
        preconditions: User has Asset Management module access with registration permissions.
        status: draft
        sequence: 0
      - name: Complete Financial Registration for Asset
        description: Finance user completes the financial registration phase for a physically registered asset by entering purchase cost, GL account code, depreciation method, ownership type, and salvage value.
        preconditions: Asset has been physically registered and is pending financial registration. User has finance module access.
        status: draft
        sequence: 1
      - name: Bulk Import Assets via CSV/Excel
        description: User uploads a CSV or Excel file containing multiple asset records using the import template. System validates data, reports errors, and creates asset records for valid entries.
        preconditions: User has admin access to Asset Management module. Import template is available.
        status: draft
        sequence: 2
      - name: Auto-Register Asset from Purchase Order
        description: Upon GRN completion in the procurement module, system prompts user to register received items as assets with pre-filled supplier, cost, and invoice data.
        preconditions: A purchase order has been completed with GRN. Procurement module integration is active.
        status: draft
        sequence: 3
      - name: Generate and Print Asset QR Code Label
        description: User generates a QR code label for a registered asset and sends it to a connected label printer or downloads it for printing.
        preconditions: Asset is registered in the system. Label printer is configured or PDF download is available.
        status: draft
        sequence: 4
      - name: Upload Asset Documents
        description: User attaches service contracts, insurance certificates, invoices, user manuals, or photos to an existing asset record.
        preconditions: Asset exists in the system.
        status: draft
        sequence: 5
      - name: View and Search Asset Register
        description: User browses the full asset register with tabs by status (Active, In Repair, Pending Disposal, Missing, Disposed) and uses search and filter capabilities by class, category, location, and department.
        preconditions: Assets exist in the system.
        status: draft
        sequence: 6
      - name: View Asset Detail
        description: User views complete asset information including physical details, financial data (purchase cost, book value, depreciation method), assignment history, maintenance history, service schedule, and attached documents.
        preconditions: Asset exists in the system.
        status: draft
        sequence: 7

  - name: Maintenance Management
    description: |
      End-to-end maintenance lifecycle management covering fault/defect reporting, multi-step assessment and evaluation, technician assignment, work order tracking, preventive maintenance scheduling, and custodian feedback confirmation. Supports internal resolution and external warranty claim routing. Fault reports follow a structured status workflow: Reported → Under Review → Assessed → Assigned Internal / Warranty Claim Sent → Work Order Created → Completed → Closed. HOD review tasks are auto-generated during assessment. Automated reminders for scheduled preventive maintenance.
    module: Asset Management
    priority: high
    status: draft
    ecosystem: Admin Desktop App + Backend + Mobile App
    inScope: |
      Fault/defect reporting with photos and description via mobile and desktop, fault priority levels (Low, Medium, High, Critical), fault categories (Electrical, Mechanical, Structural, Plumbing, IT Equipment, Other), structured status workflow (Reported, Under Review, Assessed, On Hold, Recommended for Disposal, Assigned Internal, Warranty Claim Sent, Work Order Created, Completed, Closed), assessment and evaluation step with auto-generated HOD review task, internal technician assignment, external warranty claim submission to supplier/warranty provider, custodian feedback and confirmation upon completion, work order status tracking, spare parts usage logging, maintenance cost tracking, resolution type tracking (Internal vs External), preventive maintenance schedule creation with month or mileage service intervals, service history tracking per asset, maintenance history per asset.
    outOfScope: |
      Spare parts inventory management (separate module), vendor procurement for parts, third-party maintenance platform integration.
    sequence: 2
    mockScreens:
      - fileName: maintenance_hub
        sequence: 1
      - fileName: maintenance_schedule_configuration
        sequence: 2
      - fileName: fault_reporting
        sequence: 3
      - fileName: work_order_management
        sequence: 4
    processFlows:
      - fileName: asset_maintenance_reporting_flow
        sequence: 1
    uatFlows:
      - name: Report Asset Fault via Mobile
        description: User scans asset QR code on the mobile app and submits a fault report with description, fault category, severity/priority level, and photos.
        preconditions: User has mobile app installed. Asset is registered with a QR label.
        status: draft
        sequence: 0
      - name: Report Asset Fault via Desktop
        description: User searches for an asset on the desktop interface and submits a fault/defect report with description, fault category, priority level, and supporting photos.
        preconditions: User has Asset Management access with fault reporting permissions.
        status: draft
        sequence: 1
      - name: Evaluate and Assess Fault Report
        description: Maintenance coordinator reviews the submitted fault report, updates status to Under Review, performs assessment, and determines resolution approach (internal repair, warranty claim, or recommended for disposal). An HOD review task is auto-generated.
        preconditions: A fault report has been submitted and is in Reported status.
        status: draft
        sequence: 2
      - name: Assign Internal Technician to Fault
        description: After assessment, maintenance coordinator assigns an internal technician to the fault, advancing the status to Assigned Internal and creating a work order.
        preconditions: Fault report has been assessed. Resolution type is Internal.
        status: draft
        sequence: 3
      - name: Submit Warranty Claim for Fault
        description: For in-warranty assets, maintenance coordinator routes the assessed fault report as a warranty claim to the supplier/warranty provider, advancing the status to Warranty Claim Sent.
        preconditions: Asset is within warranty period. Fault report has been assessed with resolution type Warranty Claim.
        status: draft
        sequence: 4
      - name: Technician Updates Work Order Progress
        description: Assigned technician updates work order status, adds progress notes, logs time spent, and records spare parts used.
        preconditions: Work order has been created and assigned to the technician.
        status: draft
        sequence: 5
      - name: Complete Maintenance Work and Obtain Custodian Feedback
        description: Technician marks work as complete. System prompts asset custodian to confirm the asset is operational and provide feedback, closing the fault report.
        preconditions: Work order is in Work Order Created or Completed status. Custodian is assigned.
        status: draft
        sequence: 6
      - name: Create Preventive Maintenance Schedule
        description: Admin creates a recurring preventive maintenance schedule for an asset specifying service intervals (by months or mileage), checklist items, and assigned technician or team.
        preconditions: Asset is registered. User has maintenance admin access.
        status: draft
        sequence: 7
      - name: Execute Preventive Maintenance Task
        description: Technician receives a scheduled preventive maintenance task, performs the checklist items, records mileage or service readings, and marks completion.
        preconditions: A preventive maintenance task is due. Technician is assigned.
        status: draft
        sequence: 8
      - name: View Maintenance History
        description: User views complete maintenance and service history for an asset including all fault reports, work orders, costs, and preventive maintenance records.
        preconditions: Asset exists with maintenance records.
        status: draft
        sequence: 9

  - name: Asset Audit Management
    description: |
      Quarterly asset audit workflow supporting audit report creation, mobile-based execution via QR/barcode scanning, asset condition assessment, discrepancy identification (missing, unregistered, condition changes), and audit report generation. Audit reports are organised by quarter with status tracking (Not Started, Ongoing, Completed). Individual asset audit logs capture condition, location confirmation, and findings per audit cycle.
    module: Asset Management
    priority: high
    status: draft
    ecosystem: Admin Desktop App + Backend + Mobile App
    inScope: |
      Quarterly audit report creation and management, audit status tracking (Not Started, Ongoing, Completed), mobile-based audit execution with QR/barcode scanning, asset condition assessment during audit (Good, Fair, Poor, Damaged), location verification during audit, photo capture during audit, missing asset flagging, unregistered asset identification, asset condition summary statistics (good condition count, poor condition count, in repair count, missing count), discrepancy detection and tracking, audit log per asset per audit cycle, audit completion and sign-off, audit report with summary statistics (total assets, active, disposed, missing, condition breakdown), audit history across quarters.
    outOfScope: |
      Automated RFID mass-scanning audits, third-party auditor portal access, automated discrepancy resolution.
    sequence: 3
    mockScreens:
      - fileName: audit_planner
        sequence: 1
      - fileName: audit_reconciliation
        sequence: 2
    processFlows:
      - fileName: asset_audit_process_flow
        sequence: 1
    uatFlows:
      - name: Create Quarterly Audit Report
        description: Admin creates a new quarterly audit report specifying the audit quarter, scope, and assigned auditors.
        preconditions: User has audit management permissions. Assets exist in the system.
        status: draft
        sequence: 0
      - name: Start Audit Execution on Mobile
        description: Auditor opens the assigned quarterly audit on the mobile app and begins scanning assets via QR code/barcode at designated locations.
        preconditions: Audit report is in Not Started or Ongoing status. Auditor has mobile app with audit module access.
        status: draft
        sequence: 1
      - name: Scan and Verify Asset During Audit
        description: Auditor scans an asset's QR/barcode, confirms location, assesses condition (Good, Fair, Poor, Damaged), and captures photos if needed. An audit log entry is created for the asset.
        preconditions: Audit is in progress. Auditor is at the asset location.
        status: draft
        sequence: 2
      - name: Flag Missing Asset During Audit
        description: Auditor marks an asset as missing when it cannot be found at its registered location during the audit cycle.
        preconditions: Audit is in progress. Asset appears in the expected audit list but is not physically present.
        status: draft
        sequence: 3
      - name: View Audit Progress in Real-Time
        description: Admin monitors quarterly audit progress showing scanned vs. expected asset counts, completion percentage, condition summaries, and flagged discrepancies.
        preconditions: An audit is in Ongoing status.
        status: draft
        sequence: 4
      - name: Review Audit Findings and Discrepancies
        description: Admin reviews audit findings including missing assets, condition changes, and unscanned assets and takes corrective actions (update location, mark as lost, flag for investigation).
        preconditions: Audit has been partially or fully executed with findings recorded.
        status: draft
        sequence: 5
      - name: Complete Audit and Generate Report
        description: Admin finalises the quarterly audit and generates a comprehensive audit report with summary statistics including total assets, missing count, condition breakdown, and disposed assets.
        preconditions: Audit execution is complete. Discrepancies have been reviewed.
        status: draft
        sequence: 6
      - name: View Audit History
        description: Admin views past quarterly audits with results, asset counts, condition summaries, and discrepancy statistics across audit cycles.
        preconditions: Previous audits have been completed.
        status: draft
        sequence: 7

  - name: Asset Depreciation & Financial Tracking
    description: |
      Automated depreciation calculation and financial tracking for all registered assets using GL account codes. Supports multiple depreciation methods with prorated calculations for mid-month registrations and disposals. Generates monthly depreciation schedule reports grouped by GL account code with subtotals, grand totals, and Excel export capability for financial reporting.
    module: Asset Management
    priority: medium
    status: draft
    ecosystem: Admin Desktop App + Backend
    inScope: |
      GL account code configuration with depreciation method and annual rate settings, depreciation method support (Straight-Line, Declining-Balance, Sum-of-Years-Digits), automatic monthly depreciation calculation with proration for mid-month registrations and disposals, depreciation schedule showing cost at month start/end, accumulated depreciation, net book value, and disposal adjustments, monthly and quarterly depreciation report grouping, depreciation reports grouped by GL account code with subtotals and grand totals, current book value display per asset, Excel export for depreciation reports with formatted workbooks, asset GL account code assignment during financial registration, salvage value and useful life configuration per account code.
    outOfScope: |
      Tax depreciation schedules, integration with external accounting systems, accounts payable/receivable, standalone insurance policy management.
    sequence: 4
    mockScreens:
      - fileName: depreciation_valuation
        sequence: 1
    processFlows: []
    uatFlows:
      - name: Configure Account Code (GL Code) for Depreciation
        description: Admin creates or edits a GL account code specifying the depreciation method, annual depreciation rate, and whether manual financial registration is required for assets under that code.
        preconditions: User has finance module access. Asset Management module is configured.
        status: draft
        sequence: 0
      - name: Assign Account Code During Financial Registration
        description: Finance user assigns a GL account code to an asset during financial registration, which determines the depreciation method and rate applied to that asset.
        preconditions: Asset has been physically registered. GL account codes are configured. User has finance module access.
        status: draft
        sequence: 1
      - name: View Asset Depreciation Schedule
        description: User views the full monthly depreciation schedule for an asset showing cost at month start/end, depreciation amount for the month, accumulated depreciation, and net book value.
        preconditions: Asset is financially registered with purchase cost and GL account code assigned.
        status: draft
        sequence: 2
      - name: Generate Monthly Depreciation Report
        description: Finance user generates a depreciation schedule report for a selected month or period, showing depreciation amounts grouped by GL account code with subtotals and grand totals.
        preconditions: Assets are financially registered with depreciation configurations.
        status: draft
        sequence: 3
      - name: Export Depreciation Report to Excel
        description: Finance user exports the generated depreciation report to a formatted Excel workbook for financial record-keeping or audit submission.
        preconditions: Depreciation report has been generated.
        status: draft
        sequence: 4
      - name: Record Asset Revaluation
        description: Finance user records a revaluation for an asset, updating its book value with justification and effective date.
        preconditions: Asset exists and is financially registered. User has finance permissions.
        status: draft
        sequence: 5

  - name: Asset Disposal Management
    description: |
      End-to-end asset disposal workflow from disposal request through three-level approval (HOD, Finance, Top Management), disposal execution, environmental compliance documentation, and PDF disposal certificate generation. Supports multiple disposal methods — Sale, Donation, Recycling, Scrapping, and Trade-In. Unique reference numbers are generated in the format K1-DSP-{YYMMDD}-{ID}. Assets are marked as Disposed and removed from the active register upon execution.
    module: Asset Management
    priority: high
    status: draft
    ecosystem: Admin Desktop App + Backend
    inScope: |
      Disposal request submission with disposal method, reason, estimated disposal value, and supporting documents, disposal method selection (Sale, Donation, Recycling, Scrapping, Trade-In), three-level approval workflow (HOD Approval → Finance Review → Top Management Approval), disposal valuation (estimated disposal value vs. current book value), buyer/recipient information capture (name, contact, address), environmental compliance checklist and notes, PDF disposal certificate generation and download, asset status update to Disposed upon execution, rejection workflow with remarks at each approval level, cancellation of pending disposal requests, disposal history and audit trail, batch disposal for multiple assets, unique reference number generation (K1-DSP-{YYMMDD}-{ID}).
    outOfScope: |
      E-waste vendor management, auction platform integration, environmental regulatory submission, financial write-off posting to external accounting systems.
    sequence: 5
    mockScreens:
      - fileName: disposal_workflow
        sequence: 1
    processFlows:
      - fileName: asset_disposal_process_flow
        sequence: 1
    uatFlows:
      - name: Submit Disposal Request
        description: User selects one or more assets and submits a disposal request specifying the disposal method, reason, estimated disposal value, and supporting documentation.
        preconditions: User has disposal request permissions. Assets are in Active or Pending Disposal status.
        status: draft
        sequence: 0
      - name: HOD Reviews Disposal Request
        description: Department HOD reviews the disposal request and approves or rejects it with comments.
        preconditions: Disposal request is in Pending HOD Approval status.
        status: draft
        sequence: 1
      - name: Finance Reviews Disposal Request
        description: Finance team reviews the disposal for financial impact, confirms current book value, and approves or rejects the request.
        preconditions: Disposal request has HOD approval and is in Pending Finance Review status.
        status: draft
        sequence: 2
      - name: Top Management Approves Disposal
        description: For assets requiring the highest authorisation level, Top Management provides final disposal approval.
        preconditions: Disposal has Finance approval and is in Pending Top Management Approval status.
        status: draft
        sequence: 3
      - name: Execute Asset Disposal
        description: Asset officer executes the approved disposal by recording the disposal date, method, actual disposal value (if sold), buyer/recipient details, and completing the environmental compliance checklist.
        preconditions: Disposal request is fully approved at all required levels.
        status: draft
        sequence: 4
      - name: Generate Disposal Certificate
        description: System generates a PDF disposal certificate documenting the asset details, disposal method, approval chain, compliance information, and disposal value. Certificate is available for download.
        preconditions: Disposal has been executed.
        status: draft
        sequence: 5
      - name: Reject Disposal Request
        description: Approver (HOD, Finance, or Top Management) rejects the disposal request with rejection remarks, returning it to the requester.
        preconditions: Disposal request is in a pending approval status.
        status: draft
        sequence: 6
      - name: Cancel Disposal Request
        description: Requester or administrator cancels a pending disposal request that has not yet been executed.
        preconditions: Disposal request has not been executed.
        status: draft
        sequence: 7
      - name: View Disposal History
        description: User views the complete history of disposal requests with filters for date range, department, disposal method, status, and value.
        preconditions: Disposal requests exist in the system.
        status: draft
        sequence: 8
      - name: Batch Disposal Request
        description: User selects multiple assets for batch disposal with a common disposal method and reason.
        preconditions: Multiple assets are eligible for disposal.
        status: draft
        sequence: 9

  - name: Asset Transfer Management
    description: |
      End-to-end asset transfer workflow enabling department, location, and custodian changes for registered assets. Supports digital transfer requests with HOD approval, execution by asset officer, and receipt confirmation by the receiving party. PDF transfer certificates are generated upon completion. The mobile app supports QR code-based transfer initiation with real-time WebSocket status updates.
