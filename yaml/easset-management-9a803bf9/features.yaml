    priority: high
    status: draft
    ecosystem: Admin Desktop App + Backend + Mobile App
    inScope: |
      Transfer request submission specifying source and destination department, location, and custodian, HOD approval workflow for transfer requests, transfer execution by asset officer, receipt confirmation by the receiving party, rejection workflow with remarks, cancellation of pending transfer requests, PDF transfer certificate generation and download, mobile QR code-based transfer initiation, real-time WebSocket notifications during transfer process, unique transfer reference number generation, transfer history and audit trail, asset location and custodian automatic update upon transfer completion.
    outOfScope: |
      Multi-hop transfers (chained sequential transfers), automated mass transfers via RFID, cross-organisation transfers.
