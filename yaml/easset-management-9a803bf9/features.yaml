        status: draft
        sequence: 0
      - name: HOD Approves Transfer Request
        description: Department HOD reviews the asset transfer request and approves or rejects it with comments.
        preconditions: Transfer request is in Pending HOD Approval status.
        status: draft
        sequence: 1
      - name: Execute Asset Transfer
        description: Asset officer executes the approved transfer, updating the asset's location, department, and custodian in the system.
